name: Update Booble Playlist

on:
  schedule:
    - cron: '0 */1 * * *'    # every 1 hours (live streams change frequently)
  workflow_dispatch:          # manual trigger

concurrency:
  group: booble-playlist
  cancel-in-progress: false   # let running job finish, queue next

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ──────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Chrome (stable, headless) ───────────────────────────────────
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome
        run: |
          google-chrome --version || chromium-browser --version || true

      # ── 4. Python deps ─────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            selenium \
            webdriver-manager \
            beautifulsoup4 \
            lxml

      # ── 5. models.txt guard ────────────────────────────────────────────
      - name: Ensure models.txt exists
        run: |
          if [ ! -f models.txt ]; then
            echo "models.txt not found — creating empty file"
            touch models.txt
          else
            echo "models.txt found:"
            cat models.txt
          fi

      # ── 6. Run scraper ─────────────────────────────────────────────────
      - name: Run booble.py
        run: |
          python booble.py
        env:
          # Selenium / Chrome need a display var on some Ubuntu runners
          DISPLAY: ":99"
        timeout-minutes: 45    # live scraping can be slow; kill if hung

      # ── 7. Verify output ───────────────────────────────────────────────
      - name: Check playlist output
        run: |
          if [ ! -f playlist.m3u ]; then
            echo "ERROR: playlist.m3u was not created"
            exit 1
          fi
          echo "playlist.m3u size: $(wc -l < playlist.m3u) lines"
          echo "--- First 30 lines ---"
          head -30 playlist.m3u

      # ── 8. Commit & push ───────────────────────────────────────────────
      - name: Commit and Push Changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit (no new live streams)."
            exit 0
          fi

          LIVE_COUNT=$(grep -c "^https\?://" playlist.m3u || true)
          git commit -m "Update playlist — ${LIVE_COUNT} live streams [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          for i in 1 2 3 4 5; do
            git push origin main && break
            echo "Push rejected, retrying ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 8 + 2))
          done
