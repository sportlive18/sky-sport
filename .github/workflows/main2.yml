# ── 7. Verify output ───────────────────────────────────────────────
- name: Check playlist output
  run: |
    if [ ! -f playlists/live.m3u ]; then
      echo "ERROR: playlists/live.m3u was not created"
      exit 1
    fi
    echo "playlists/live.m3u size: $(wc -l < playlists/live.m3u) lines"
    head -30 playlists/live.m3u

# ── 8. Commit & push ───────────────────────────────────────────────
- name: Commit and Push Changes
  run: |
    git config user.name  "github-actions[bot]"
    git config user.email "github-actions[bot]@users.noreply.github.com"

    git add playlists/live.m3u   # <-- change here

    if git diff --cached --quiet; then
      echo "No changes to commit (no new live streams)."
      exit 0
    fi

    LIVE_COUNT=$(grep -c "^https\?://" playlists/live.m3u || true)   # <-- and here
    git commit -m "Update playlist — ${LIVE_COUNT} live streams [$(date -u '+%Y-%m-%d %H:%M UTC')]"

    for i in 1 2 3 4 5; do
      git push origin main && break
      echo "Push rejected, retrying ($i/5)..."...
      git pull --rebase origin main
      sleep $((RANDOM % 8 + 2))
    done
