name: Update PornHao Playlist

on:
  schedule:
    - cron: '0 */1 * * *'      # every 6 hours
  workflow_dispatch:            # manual trigger
  push:
    branches:
      - main
    paths:
      - 'sniffer.py'     # trigger when script changes
      - 'model.txt'            # also trigger if model list changes

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write          # needed to commit changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager requests beautifulsoup4

      - name: Create default model.txt if missing
        run: |
          if [ ! -f model.txt ]; then
            echo "violet-myers" > model.txt
            echo "penny-barber" >> model.txt
            echo "sheena-ryder" >> model.txt
            echo "ava-addams" >> model.txt
            echo "comatoss" >> model.txt
            echo "brandi-love" >> model.txt
            echo "kayla-kayden" >> model.txt
            echo "ariella-ferrera" >> model.txt
          fi

      - name: Run scraper
        run: |
          python sniffer.py --max 20

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -lh playlist.m3u playlist.json
          test -f playlist.m3u || { echo "ERROR: playlist.m3u not created"; exit 1; }
          test -f playlist.json || { echo "ERROR: playlist.json not created"; exit 1; }

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Auto-update PornHao playlists"
          git push origin main
