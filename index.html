<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cricbuzz - Live Streaming</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#0a1628 0%,#1a3a1a 50%,#0a1628 100%);min-height:100vh;color:#fff}
.header{background:rgba(10,22,40,0.97);padding:18px 36px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #e8731a;box-shadow:0 4px 20px rgba(232,115,26,0.3)}
.logo-wrap{display:flex;align-items:center;gap:6px}
.logo-cric{font-size:32px;font-weight:900;color:#e8731a;letter-spacing:1px}
.logo-buzz{font-size:32px;font-weight:900;color:#fff;letter-spacing:1px}
.logo-dot{width:10px;height:10px;background:#e8731a;border-radius:50%;margin-bottom:4px;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.live-badge{background:linear-gradient(135deg,#cc0000,#990000);padding:9px 22px;border-radius:22px;font-size:13px;font-weight:700;letter-spacing:1px;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 15px rgba(255,0,0,0.4)}50%{box-shadow:0 4px 25px rgba(255,0,0,0.8)}}
.container{max-width:1400px;margin:28px auto;padding:0 18px}
.video-section{background:rgba(0,0,0,0.65);border-radius:12px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,0.7);border:2px solid rgba(232,115,26,0.35)}
.video-header{background:linear-gradient(135deg,#e8731a,#b85a0f);padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
.video-title{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.hd-badge{background:linear-gradient(135deg,#00cc44,#009933);padding:3px 11px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;margin-left:10px}
.live-indicator{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.45);padding:7px 18px;border-radius:22px;border:2px solid #ff0000}
.live-dot{width:11px;height:11px;background:#ff0000;border-radius:50%;animation:pulse 1.5s infinite;box-shadow:0 0 8px #ff0000}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(1.3)}}
.iframe-wrapper{position:relative;width:100%;padding-bottom:56.25%;background:#000;cursor:pointer}
.iframe-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;pointer-events:none}
.click-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;cursor:pointer}
.controls{padding:18px 28px;background:linear-gradient(180deg,rgba(0,0,0,0.8),rgba(10,30,10,0.9));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:10px 22px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.3s;background:linear-gradient(135deg,#e8731a,#b85a0f);color:#fff;text-transform:uppercase;letter-spacing:0.5px;box-shadow:0 4px 15px rgba(232,115,26,0.3)}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(232,115,26,0.5)}
.btn:active{transform:translateY(0)}
@media(max-width:768px){
  .header{padding:13px 16px;flex-direction:column;gap:12px}
  .logo-cric,.logo-buzz{font-size:22px}
  .controls{justify-content:center;padding:13px}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo-wrap">
    <div class="logo-cric">Cric</div>
    <div class="logo-buzz">buzz</div>
    <div class="logo-dot"></div>
  </div>
  <div class="live-badge">&#9679; LIVE NOW</div>
</div>

<div class="container">
  <div class="video-section">

    <div class="video-header">
      <div class="video-title">
        Live Cricket Coverage
        <span class="hd-badge">HD</span>
      </div>
      <div class="live-indicator">
        <div class="live-dot"></div>
        <span style="font-weight:700;letter-spacing:1px">LIVE</span>
      </div>
    </div>

    <div class="iframe-wrapper" id="iframeWrapper">
      <iframe
        id="streamFrame"
        src="https://hitsportshdd.xyz/fr.php?src=https://markplushub.shop/myplayer/stream-369.php"
        allowfullscreen
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        scrolling="no"
        frameborder="0">
      </iframe>
      <div class="click-overlay" id="clickOverlay" onclick="handlePlayerClick()"></div>
    </div>

    <div class="controls">
      <button class="btn" onclick="reloadStream()">&#x1F504; Reload</button>
      <button class="btn" onclick="enterFullscreen()">&#x26F6; Fullscreen</button>
    </div>

  </div>
</div>

<script>
  function reloadStream() {
    var f = document.getElementById('streamFrame');
    f.src = f.src;
  }

  function enterFullscreen() {
    var wrapper = document.getElementById('iframeWrapper');
    var frame = document.getElementById('streamFrame');
    var el = wrapper;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) {
      req.call(el).then(function() {
        lockLandscape();
      }).catch(function() {
        var req2 = frame.requestFullscreen || frame.webkitRequestFullscreen || frame.mozRequestFullScreen || frame.msRequestFullscreen;
        if (req2) req2.call(frame).then(lockLandscape).catch(function(){});
      });
    }
  }

  function lockLandscape() {
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function(){});
      } else if (window.screen.lockOrientation) {
        window.screen.lockOrientation('landscape');
      } else if (window.screen.mozLockOrientation) {
        window.screen.mozLockOrientation('landscape');
      }
    } catch(e) {}
  }

  function handlePlayerClick() {
    var overlay = document.getElementById('clickOverlay');
    overlay.style.display = 'none';
    var frame = document.getElementById('streamFrame');
    frame.style.pointerEvents = 'auto';
    enterFullscreen();
  }

  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement) {
      try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } catch(e) {}
      var overlay = document.getElementById('clickOverlay');
      var frame = document.getElementById('streamFrame');
      overlay.style.display = 'block';
      frame.style.pointerEvents = 'none';
    }
  });
</script>

</body>
</html>
