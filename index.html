<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Sport - Live Streaming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #001428 0%, #003d6b 50%, #001e3c 100%);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(0, 20, 40, 0.95);
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #00a8ff;
            box-shadow: 0 4px 20px rgba(0, 168, 255, 0.3);
        }

        .logo-container { display: flex; align-items: center; gap: 15px; }

        .logo {
            font-size: 36px; font-weight: 900; color: #00a8ff;
            text-transform: uppercase; letter-spacing: 2px;
        }

        .sport-text {
            font-size: 36px; font-weight: 900; color: #fff;
            text-transform: uppercase; letter-spacing: 2px;
        }

        .live-badge {
            background: linear-gradient(135deg, #ff0000, #cc0000);
            padding: 10px 24px; border-radius: 25px;
            font-size: 14px; font-weight: 700; letter-spacing: 1px;
            animation: glow 2s infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 4px 15px rgba(255,0,0,0.4); }
            50% { box-shadow: 0 4px 25px rgba(255,0,0,0.8); }
        }

        .container { max-width: 1400px; margin: 30px auto; padding: 0 20px; }

        .video-section {
            background: rgba(0,0,0,0.6);
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 25px 70px rgba(0,0,0,0.7);
            border: 2px solid rgba(0,168,255,0.3);
        }

        .video-header {
            background: linear-gradient(135deg, #00a8ff, #0066cc);
            padding: 18px 30px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .video-title { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .live-indicator {
            display: flex; align-items: center; gap: 10px;
            background: rgba(0,0,0,0.4); padding: 8px 20px;
            border-radius: 25px; border: 2px solid #ff0000;
        }

        .live-dot {
            width: 12px; height: 12px; background: #ff0000;
            border-radius: 50%; animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px #ff0000;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }

        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .controls {
            padding: 20px 30px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8), rgba(0,30,60,0.9));
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        }

        .btn {
            padding: 11px 24px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #00a8ff, #0066cc);
            color: white; text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,168,255,0.3);
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,168,255,0.5); }
        .btn:active { transform: translateY(0); }

        .quality-badge {
            background: linear-gradient(135deg, #00ff00, #00cc00);
            padding: 4px 12px; border-radius: 4px;
            font-size: 11px; font-weight: 700; color: #000; margin-left: 10px;
        }

        @media (max-width: 768px) {
            .header { padding: 15px 20px; flex-direction: column; gap: 15px; }
            .logo, .sport-text { font-size: 24px; }
            .controls { justify-content: center; padding: 15px; }
            .btn { padding: 10px 18px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-container">
        <div class="logo">SKY</div>
        <div class="sport-text">SPORT</div>
    </div>
    <div class="live-badge">● LIVE NOW</div>
</div>

<div class="container">
    <div class="video-section">

        <div class="video-header">
            <div class="video-title">
                Live Sports Coverage
                <span class="quality-badge">HD</span>
            </div>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span style="font-weight:700;letter-spacing:1px;">LIVE</span>
            </div>
        </div>

        <div class="iframe-wrapper" id="iframeWrapper">
            <iframe
                id="streamFrame"
                src="https://dadocric.st/player.php?id=crich2"
                allowfullscreen
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                scrolling="no"
                frameborder="0">
            </iframe>
        </div>

        <div class="controls">
            <button class="btn" onclick="reloadStream()">🔄 Reload</button>
            <button class="btn" onclick="enterFullscreen()">⛶ Fullscreen</button>
        </div>

    </div>
</div>

<script>
    function reloadStream() {
        const frame = document.getElementById('streamFrame');
        frame.src = frame.src;
    }

    function enterFullscreen() {
        const wrapper = document.getElementById('iframeWrapper');
        const frame = document.getElementById('streamFrame');

        const req = wrapper.requestFullscreen
            || wrapper.webkitRequestFullscreen
            || wrapper.mozRequestFullScreen
            || wrapper.msRequestFullscreen;

        if (req) {
            req.call(wrapper).catch(() => {
                const req2 = frame.requestFullscreen
                    || frame.webkitRequestFullscreen
                    || frame.mozRequestFullScreen
                    || frame.msRequestFullscreen;
                if (req2) req2.call(frame).catch(() => {});
            });
        }
    }

    // Auto-trigger fullscreen on first click inside the player
    document.getElementById('iframeWrapper').addEventListener('click', function () {
        setTimeout(enterFullscreen, 300);
    }, { once: true });
</script>

</body>
</html>
